version: 1
name: story_list_empty
metadata:
    feature: list
    tags: [story, empty]
intent: |
    the list story renders an empty inbox with the title at the origin.
target:
    cmd: ["./examples/apps/stories/stories", "list/empty"]
    cwd: "."
terminal:
    cols: 80
    rows: 24
    profile: xterm-256color
    alternateScreen: require
preconditions:
    commands:
        - run: "go build -o ./examples/apps/stories/stories ./examples/stories"
          timeoutMs: 30000
steps:
    - wait:
        screen:
            contains: "Inbox"
        timeoutMs: 5000
    - snapshot: list_empty
    - press: "q"
    - wait:
        process:
            exitCode: 0
        timeoutMs: 3000
outcomes:
    - id: title_at_origin
      description: the title starts at cell 0,0
      verify:
        cell:
            x: 0
            y: 0
            char: "I"
    - id: empty_copy
      description: the empty state copy is visible
      verify:
        region:
            x: 0
            y: 2
            width: 80
            height: 3
            contains: "(empty)"
contractHash: sha256:b4fe196d8ce193fab42ee12aa219a6e84e94c23418779652944efce27501c360
