version: 1
name: story_list_rows
metadata:
    feature: list
    tags: [story, rows]
intent: |
    the list story renders three inbox rows with the first item selected.
target:
    cmd: ["./examples/apps/stories/stories", "list/rows"]
    cwd: "."
terminal:
    cols: 80
    rows: 24
    profile: xterm-256color
    alternateScreen: require
preconditions:
    commands:
        - run: "go build -o ./examples/apps/stories/stories ./examples/stories"
          timeoutMs: 30000
steps:
    - wait:
        screen:
            contains: "hello"
        timeoutMs: 5000
    - snapshot: list_rows
    - press: "q"
    - wait:
        process:
            exitCode: 0
        timeoutMs: 3000
outcomes:
    - id: title_at_origin
      description: the title starts at cell 0,0
      verify:
        cell:
            x: 0
            y: 0
            char: "I"
    - id: selected_marker
      description: the first row is marked selected
      verify:
        region:
            x: 0
            y: 2
            width: 20
            height: 1
            contains: "> hello"
contractHash: sha256:84c30ef88f48ac9e9ec23f617b41b101c774874bca22b83bce7b736c7741512d
