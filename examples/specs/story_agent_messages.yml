version: 1
name: story_agent_messages
metadata:
    feature: agent
    tags: [story, messages]
intent: |
    the agent story renders a you/glyph exchange measuring the inbox title cell.
target:
    cmd: ["./examples/apps/stories/stories", "agent/messages"]
    cwd: "."
terminal:
    cols: 80
    rows: 24
    profile: xterm-256color
    alternateScreen: require
preconditions:
    commands:
        - run: "go build -o ./examples/apps/stories/stories ./examples/stories"
          timeoutMs: 30000
steps:
    - wait:
        screen:
            contains: "Cell 0,0 is I"
        timeoutMs: 5000
    - snapshot: agent_messages
    - press: "q"
    - wait:
        process:
            exitCode: 0
        timeoutMs: 3000
outcomes:
    - id: brand_at_origin
      description: the brand starts at cell 0,0
      verify:
        cell:
            x: 0
            y: 0
            char: "g"
    - id: glyph_reply
      description: the glyph reply names the title cell
      verify:
        region:
            x: 0
            y: 2
            width: 80
            height: 12
            contains: "Cell 0,0 is I"
contractHash: sha256:87cd0869b0ebea0535c3ecd2da5c252970cc2dce346cf0a58bf3f154a3f5215b
