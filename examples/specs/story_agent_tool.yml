version: 1
name: story_agent_tool
metadata:
    feature: agent
    tags: [story, tool]
intent: |
    the agent story renders a running glyph run tool call under the user turn.
target:
    cmd: ["./examples/apps/stories/stories", "agent/tool"]
    cwd: "."
terminal:
    cols: 80
    rows: 24
    profile: xterm-256color
    alternateScreen: require
preconditions:
    commands:
        - run: "go build -o ./examples/apps/stories/stories ./examples/stories"
          timeoutMs: 30000
steps:
    - wait:
        screen:
            contains: "glyph run"
        timeoutMs: 5000
    - snapshot: agent_tool
    - press: "q"
    - wait:
        process:
            exitCode: 0
        timeoutMs: 3000
outcomes:
    - id: brand_at_origin
      description: the brand starts at cell 0,0
      verify:
        cell:
            x: 0
            y: 0
            char: "g"
    - id: tool_row
      description: the tool row names glyph run
      verify:
        region:
            x: 0
            y: 5
            width: 80
            height: 3
            contains: "glyph run"
contractHash: sha256:a04e1c5ff73b28f143dc7a4784dc1627dadaa90ef5d965a1dcf2fdba8a6f900b
