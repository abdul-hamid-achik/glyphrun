version: 1
name: story_agent_streaming
metadata:
    feature: agent
    tags: [story, streaming]
intent: |
    the agent story renders a partial glyph reply while tokens are in flight.
target:
    cmd: ["./examples/apps/stories/stories", "agent/streaming"]
    cwd: "."
terminal:
    cols: 80
    rows: 24
    profile: xterm-256color
    alternateScreen: require
preconditions:
    commands:
        - run: "go build -o ./examples/apps/stories/stories ./examples/stories"
          timeoutMs: 30000
steps:
    - wait:
        screen:
            contains: "20 wide"
        timeoutMs: 5000
    - snapshot: agent_streaming
    - press: "q"
    - wait:
        process:
            exitCode: 0
        timeoutMs: 3000
outcomes:
    - id: streaming_status
      description: the header status word is streaming
      verify:
        region:
            x: 60
            y: 0
            width: 20
            height: 1
            contains: "streaming"
    - id: partial_reply
      description: the partial reply names the selected-row width
      verify:
        region:
            x: 0
            y: 2
            width: 80
            height: 10
            contains: "20 wide"
contractHash: sha256:3fb0126cdb318e07bb88b504b97217b98a49fc6f980eef40d58c5ae838b1cf11
