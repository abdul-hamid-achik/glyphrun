version: 1
name: story_agent_error
metadata:
    feature: agent
    tags: [story, error]
intent: |
    the agent story renders a failed turn when the PTY closed before ready.
target:
    cmd: ["./examples/apps/stories/stories", "agent/error"]
    cwd: "."
terminal:
    cols: 80
    rows: 24
    profile: xterm-256color
    alternateScreen: require
preconditions:
    commands:
        - run: "go build -o ./examples/apps/stories/stories ./examples/stories"
          timeoutMs: 30000
steps:
    - wait:
        screen:
            contains: "PTY closed"
        timeoutMs: 5000
    - snapshot: agent_error
    - press: "q"
    - wait:
        process:
            exitCode: 0
        timeoutMs: 3000
outcomes:
    - id: failed_status
      description: the header status word is failed
      verify:
        region:
            x: 60
            y: 0
            width: 20
            height: 1
            contains: "failed"
    - id: error_copy
      description: the failure copy is visible
      verify:
        region:
            x: 0
            y: 2
            width: 80
            height: 12
            contains: "PTY closed"
contractHash: sha256:64fcd976a538f3aef36af9be5e0eb73ab903e67a54ebcc117ea0a9dd18c36bbc
