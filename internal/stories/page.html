<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>glyph stories</title>
  <style>{{.CSS}}</style>
</head>
<body class="h-screen bg-ink text-zinc-200 font-mono text-[13px] leading-snug antialiased"
      x-data="catalog" x-cloak @keydown.window="onKey($event)">
  <div class="grid h-full grid-cols-[280px_1fr]">
    <aside class="flex min-h-0 flex-col border-r border-ink-line bg-ink-panel">
      <div class="border-b border-ink-line px-4 py-4">
        <p class="text-[11px] font-semibold uppercase tracking-[0.16em] text-mist">glyph stories</p>
        <p class="mt-1.5 text-[11px] text-mist" x-text="summaryLine"></p>
        <span class="mt-1.5 inline-block rounded-full border px-2 py-0.5 text-[10px] uppercase tracking-widest"
              :class="live ? (connected ? 'border-emerald-700 text-emerald-300' : 'border-amber-700 text-amber-300') : 'border-ink-line text-mist'"
              x-text="live ? (connected ? 'live' : 'reconnecting') : 'static'"></span>
      </div>
      <div class="px-4 py-2">
        <input type="search" placeholder="filter stories…" class="w-full rounded-md border border-ink-line bg-ink px-2.5 py-1.5 text-[12px] text-zinc-200"
               x-model="query" @keydown.stop>
      </div>
      <div class="min-h-0 flex-1 overflow-auto px-4 pb-5">
        <template x-for="g in groups" :key="g.feature">
          <div>
            <div class="mb-1.5 mt-4 text-[10px] uppercase tracking-[0.12em] text-mist" x-text="g.feature"></div>
            <template x-for="item in g.items" :key="item.s.key">
              <button type="button"
                      class="mb-1 w-full rounded-md border px-2.5 py-2 text-left"
                      :class="si === item.i ? 'border-sky-900/80 bg-slate-800/80 text-sky-300' : 'border-transparent hover:bg-slate-900/80'"
                      @click="select(item.i, 0)">
                <div class="flex items-center gap-2">
                  <i class="block h-2 w-2 rounded-full" :class="dotClass(item.s)"></i>
                  <span class="min-w-0 flex-1 truncate" x-text="label(item.s)"></span>
                </div>
                <div class="mt-0.5 flex items-center gap-1.5 text-[11px] text-mist">
                  <span x-text="item.s.status"></span>
                  <span x-show="item.s.golden === 'changed'" class="text-rose-300" x-text="'· ' + changedCount(item.s) + ' cells'"></span>
                  <span x-show="item.s.golden === 'missing'" class="text-amber-300">· no golden</span>
                </div>
              </button>
            </template>
          </div>
        </template>
        <p class="mt-6 text-[11px] text-mist" x-show="!groups.length">no stories match</p>
      </div>
    </aside>
    <main class="grid min-h-0 min-w-0 grid-rows-[auto_1fr_auto]">
      <nav class="flex flex-wrap items-center gap-2.5 border-b border-ink-line bg-ink-panel px-5 py-3">
        <div class="flex overflow-hidden rounded-lg border border-ink-line">
          <template x-for="m in modes" :key="m.id">
            <button type="button" class="px-3 py-1.5"
                    :class="mode === m.id ? 'bg-slate-800 text-sky-300' : 'text-mist'"
                    :disabled="m.id === 'diff' && !hasDiff"
                    @click="mode = m.id" x-text="m.label"></button>
          </template>
        </div>
        <div class="flex flex-wrap gap-1.5">
          <template x-for="(p, i) in (current && current.snapshots) || []" :key="p.name + i">
            <button type="button"
                    class="rounded-full border px-2.5 py-1 text-[12px]"
                    :class="ni === i ? 'border-sky-400/70 text-zinc-100' : 'border-ink-line bg-slate-900 text-mist'"
                    @click="ni = i">
              <span x-text="p.name"></span>
              <span x-show="p.golden === 'changed'" class="text-rose-300" x-text="' ±' + p.changed"></span>
              <span x-show="p.golden === 'match' && !p.styleOnly" class="text-emerald-300"> ✓</span>
              <span x-show="p.golden === 'match' && p.styleOnly" class="text-amber-300" :title="'styles differ in ' + p.styleOnly + ' cell(s); not enforced in text mode'" x-text="' ~' + p.styleOnly"></span>
            </button>
          </template>
        </div>
        <div class="flex-1"></div>
        <div class="flex items-center gap-1.5" x-show="live">
          <button type="button" class="rounded-md border border-ink-line px-2.5 py-1 text-[12px] text-mist hover:bg-slate-900/80"
                  :disabled="busy" @click="rerun(current && current.key)">rerun</button>
          <button type="button" class="rounded-md border border-ink-line px-2.5 py-1 text-[12px] text-mist hover:bg-slate-900/80"
                  :disabled="busy" @click="rerun('')">rerun all</button>
          <button type="button" class="rounded-md border border-amber-700 px-2.5 py-1 text-[12px] text-amber-300 hover:bg-slate-900/80"
                  x-show="current && (current.golden === 'changed' || current.golden === 'missing')"
                  :disabled="busy" @click="accept(current && current.key)">accept golden</button>
        </div>
      </nav>
      <div class="flex items-start justify-center overflow-auto p-7">
        <p class="p-12 text-center text-mist" x-show="emptyMsg" x-text="emptyMsg"></p>
        <div class="min-w-[min(100%,840px)] overflow-hidden rounded-xl border border-ink-line bg-ink-chrome shadow-2xl shadow-black/50" x-show="!emptyMsg && snap && snap.status === 'ok'">
          <div class="flex items-center gap-2 border-b border-ink-line px-3.5 py-2.5">
            <span class="flex gap-1.5">
              <i class="block h-2.5 w-2.5 rounded-full bg-[#ff5f56]"></i>
              <i class="block h-2.5 w-2.5 rounded-full bg-[#ffbd2e]"></i>
              <i class="block h-2.5 w-2.5 rounded-full bg-[#27c93f]"></i>
            </span>
            <span class="flex-1 text-center text-xs text-mist" x-text="windowTitle"></span>
            <span class="rounded-full border border-ink-line px-2 py-0.5 text-[11px] text-mist" x-text="size"></span>
          </div>
          <div class="flex items-center gap-2 border-b border-ink-line px-3.5 py-1.5 text-[11px]" x-show="mode === 'diff'">
            <span class="text-mist">showing</span>
            <button type="button" class="rounded-md border px-2 py-0.5" :class="!showGolden ? 'border-sky-400/70 text-zinc-100' : 'border-ink-line text-mist'" @click="showGolden = false">current</button>
            <button type="button" class="rounded-md border px-2 py-0.5" :class="showGolden ? 'border-sky-400/70 text-zinc-100' : 'border-ink-line text-mist'" @click="showGolden = true">golden</button>
            <span class="text-rose-300" x-text="snap ? snap.changed + ' changed cell(s)' : ''"></span>
            <span class="text-amber-300" x-show="snap && snap.styleOnly" x-text="snap ? '(' + snap.styleOnly + ' style-only; not enforced in text mode)' : ''"></span>
          </div>
          <div class="term-svg cursor-crosshair overflow-auto bg-ink-term" @mousemove="hover($event)">
            <div x-html="svg"></div>
          </div>
        </div>
      </div>
      <section class="grid grid-cols-6 gap-px border-t border-ink-line bg-ink-line">
        <template x-for="row in inspectRows" :key="row.k">
          <div class="bg-ink-panel px-3.5 py-2.5">
            <div class="mb-1 text-[10px] uppercase tracking-widest text-mist" x-text="row.k"></div>
            <div class="truncate" x-text="row.v" :title="row.v"></div>
          </div>
        </template>
      </section>
    </main>
  </div>
  <script>window.__GLYPH_STORIES__ = {{.Payload}};</script>
  <script>{{.App}}</script>
  <script>{{.Alpine}}</script>
</body>
</html>
